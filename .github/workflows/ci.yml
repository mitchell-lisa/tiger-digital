name: CI

# The site deploys straight from main via Vercel, so this is the only gate
# between a branch and production.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiger-digital-upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiger-digital-upload/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Import safety checks. They were written before this step existed and so
      # never ran; the bug they now cover reached production because of that.
      - run: npm test

      # `next build` type-checks as part of the build, so this covers tsc too.
      # The prebuild asset fetch is a no-op here because public/ is committed.
      - run: npm run build

  # Are the pages Sanity says are published actually reachable? The import can
  # only report on documents; whether a visitor gets a page also depends on the
  # deploy, the route and the slug. Reports against production, so it never
  # blocks a branch - read the log, do not trust a green tick alone.
  live:
    name: Published pages load
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tiger-digital-upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-live-pages.mjs
